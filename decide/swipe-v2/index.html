<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mio｜迷いを、3スワイプで整理。</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="/favicon-32.png">
<style>
  :root{
    --bg:#070b14; --bg2:#0b1220; --panel:#0e1726; --panel2:#132234;
    --tx:#eaf1f8; --dim:#8ea3ba; --line:#ffffff14;
    --mio:#5eb3ff; --left:#5eb3ff; --right:#39d353; --green:#39d353; --warn:#ffd23f;
    --glass:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;background:var(--bg);overscroll-behavior:none;}
  body{font-family:-apple-system,"Yu Gothic UI","Hiragino Sans","Segoe UI",Roboto,sans-serif;color:var(--tx);
    display:flex;align-items:center;justify-content:center;}
  #app{position:relative;width:100%;max-width:460px;height:100vh;height:100dvh;overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%,#122238 0%,var(--bg2) 45%,var(--bg) 100%);display:flex;flex-direction:column;}
  @media(min-width:480px){#app{height:min(880px,96vh);border-radius:26px;box-shadow:0 24px 80px rgba(0,0,0,.6);border:1px solid var(--line);}}
  /* header */
  #hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;flex:0 0 auto;z-index:20;}
  #back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--tx);
    font-size:20px;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;}
  #back.on{opacity:.85;pointer-events:auto;}
  #brand{font-size:19px;font-weight:900;letter-spacing:.02em;}
  #brand small{font-size:11px;font-weight:700;color:var(--dim);margin-left:7px;letter-spacing:.04em;}
  #pass{margin-left:auto;font-size:11.5px;font-weight:800;color:#062210;background:var(--green);border-radius:999px;padding:5px 11px;}
  #pass.hide{display:none;}
  #prog{display:flex;gap:6px;margin:10px 16px 0;flex:0 0 auto;}
  #prog i{height:4px;flex:1;border-radius:99px;background:#ffffff1a;overflow:hidden;position:relative;}
  #prog i::after{content:"";position:absolute;inset:0;width:0;background:var(--mio);border-radius:99px;transition:width .35s ease;}
  #prog i.fill::after{width:100%;}
  #prog i.now::after{width:100%;background:linear-gradient(90deg,var(--mio),#8fd0ff);}
  #prog.hide{visibility:hidden;}
  /* stage */
  #stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 18px;text-align:center;}
  /* ---- theme carousel ---- */
  .lead{padding:6px 22px 2px;}
  .lead h1{font-size:24px;font-weight:900;line-height:1.45;}
  .lead p{margin-top:8px;font-size:13.5px;color:var(--dim);}
  .track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 22px 22px;-webkit-overflow-scrolling:touch;}
  .track::-webkit-scrollbar{display:none;}
  .tcard{scroll-snap-align:center;flex:0 0 78%;max-width:300px;background:linear-gradient(160deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:270px;display:flex;flex-direction:column;cursor:pointer;
    transition:transform .15s,border-color .15s;}
  .tcard:active{transform:scale(.98);border-color:#2d6f9e;}
  .tcard .em{font-size:34px;}
  .tcard h3{margin-top:14px;font-size:20px;font-weight:900;line-height:1.4;}
  .tcard .ab{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.7;}
  .tcard .ab b{color:var(--tx);font-weight:800;}
  .tcard .go{margin-top:auto;padding-top:16px;font-size:14px;font-weight:900;color:var(--mio);}
  .swipehint{text-align:center;font-size:12px;color:var(--dim);padding-bottom:14px;}
  /* ---- deck ---- */
  #deckwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;}
  #mio{width:82px;height:82px;border-radius:50%;object-fit:cover;border:2px solid #ffffff22;
    background:#0a1220;margin:6px auto 0;flex:0 0 auto;transition:transform .18s;z-index:5;}
  #react{height:22px;margin-top:6px;text-align:center;font-size:13px;font-weight:800;color:var(--mio);opacity:0;transition:opacity .18s;flex:0 0 auto;}
  #react.on{opacity:1;}
  #cardzone{position:relative;flex:1;min-height:0;margin:8px 6px 0;}
  .card{position:absolute;left:14px;right:14px;top:6px;bottom:6px;border-radius:24px;
    background:linear-gradient(165deg,#16283e,#0e1a2b);border:1px solid #ffffff1f;
    box-shadow:0 18px 44px rgba(0,0,0,.5);padding:24px 22px;display:flex;flex-direction:column;
    will-change:transform;touch-action:none;}
  .card.back{transform:scale(.93) translateY(14px);opacity:.55;filter:saturate(.7);pointer-events:none;}
  .card .qn{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim);}
  .card .qp{margin-top:14px;font-size:23px;font-weight:900;line-height:1.5;}
  .card .qh{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.7;}
  .card .grip{margin-top:auto;text-align:center;font-size:11.5px;color:#61758c;}
  .edge{position:absolute;top:22px;font-size:15px;font-weight:900;padding:7px 13px;border-radius:12px;border:2px solid;opacity:.28;transition:opacity .05s;}
  .edge.l{left:18px;color:var(--left);border-color:var(--left);transform:rotate(-8deg);}
  .edge.r{right:18px;color:var(--right);border-color:var(--right);transform:rotate(8deg);}
  /* choice card (3-4択・pass専用) */
  .choices{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choices.one{grid-template-columns:1fr;}
  .choice{font-family:inherit;font-size:15px;font-weight:800;padding:15px 12px;border-radius:14px;border:1px solid #33566e;
    background:#132a3a;color:#eaf3fb;cursor:pointer;text-align:center;}
  .choice:active{background:#1b3d52;}
  /* bottom controls */
  #ctrls{flex:0 0 auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lr{display:flex;gap:12px;width:100%;}
  .lrbtn{flex:1;font-family:inherit;font-size:15px;font-weight:900;padding:16px 10px;border-radius:16px;border:1.5px solid;cursor:pointer;
    background:#0e1a2b;line-height:1.3;transition:transform .1s;}
  .lrbtn:active{transform:scale(.96);}
  .lrbtn.l{color:var(--left);border-color:#2f6b9e;}
  .lrbtn.r{color:var(--right);border-color:#2e7d43;}
  .lrbtn small{display:block;font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:3px;}
  #unsure{background:none;border:none;color:var(--dim);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 10px;text-decoration:underline dotted;}
  /* ---- analyze ---- */
  #lens{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
  #lens img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:2px solid #ffffff22;z-index:2;}
  #lens .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff14;}
  #lens .ring.r2{inset:-16px;} #lens .ring.r3{inset:-32px;}
  #lens .ring.lit{border-color:var(--mio);box-shadow:0 0 22px #5eb3ff55;transition:all .3s;}
  .chip-fly{position:absolute;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:6px 10px;color:var(--tx);transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .7s;z-index:3;}
  #anatext{margin-top:26px;font-size:15px;font-weight:800;color:var(--dim);}
  /* ---- result ---- */
  #stage.scroll{overflow-y:auto;}
  .res{padding:6px 18px 30px;}
  .res .rmio{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid #ffffff22;display:block;margin:6px auto 0;}
  .res .lean{text-align:center;margin-top:12px;font-size:13px;font-weight:800;color:var(--dim);}
  .res .leanbig{text-align:center;margin-top:4px;font-size:27px;font-weight:900;line-height:1.35;}
  .res .leanbig b{color:var(--mio);}
  .insight{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .insight .lb{font-size:11px;font-weight:800;color:var(--green);letter-spacing:.06em;}
  .insight .tx{margin-top:8px;font-size:15px;line-height:1.75;}
  .sumrow{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .sumrow .s{display:flex;gap:10px;align-items:flex-start;background:#0c1420;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;}
  .sumrow .s b{color:var(--dim);font-weight:800;flex:0 0 auto;}
  .sumrow .s span{color:var(--tx);font-weight:800;margin-left:auto;text-align:right;}
  .code{margin-top:14px;text-align:center;font-size:12px;color:var(--dim);}
  .code b{color:var(--tx);font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;font-size:13px;}
  .locked{margin-top:18px;border:1px dashed #2e4d68;border-radius:16px;padding:16px;background:linear-gradient(180deg,#0d1826,#0b1420);position:relative;}
  .locked .lb{font-size:11px;font-weight:800;color:var(--warn);letter-spacing:.06em;}
  .locked ul{margin:10px 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:9px;}
  .locked li{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;}
  .locked li .k{width:15px;height:15px;flex:0 0 auto;opacity:.7;}
  .locked li .blur{filter:blur(4.5px);color:var(--dim);}
  .cta{margin-top:16px;display:block;text-align:center;text-decoration:none;border-radius:16px;padding:17px 14px;
    font-weight:900;font-size:17px;color:#04210f;background:linear-gradient(120deg,var(--green),#7fe38a);box-shadow:0 10px 26px #39d35333;}
  .cta small{display:block;font-size:11.5px;font-weight:700;color:#0a3a1c;margin-top:4px;opacity:.9;}
  .redo{margin-top:12px;display:block;width:100%;text-align:center;background:none;border:1px solid var(--line);color:var(--dim);
    font-family:inherit;font-size:13px;font-weight:700;border-radius:12px;padding:12px;cursor:pointer;}
  .disc{margin-top:14px;font-size:11px;color:#5f7288;line-height:1.7;text-align:center;}
  /* paid result */
  .badge{display:inline-block;font-size:26px;font-weight:900;padding:8px 24px;border-radius:999px;margin:6px 0;}
  .badge.GO{background:#12351f;color:#7ee787;border:2px solid #2ea04366;}
  .badge.NO{background:#3a1620;color:#fca5a5;border:2px solid #f0645a55;}
  .badge.HOLD{background:#2a2410;color:#ffd23f;border:2px solid #f0883e55;}
  @media (prefers-reduced-motion: reduce){
    .card,#mio,#prog i::after,.chip-fly,#lens .ring{transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <button id="back" aria-label="戻る">‹</button>
    <div id="brand">Mio<small>迷いを、3スワイプで整理。</small></div>
    <div id="pass" class="hide"></div>
  </header>
  <div id="prog" class="hide"><i></i><i></i><i></i></div>
  <main id="stage"></main>
</div>

<script type="module">
import { TEMPLATES } from '/decide/decide-core.js';
import { buildDeck, leanFree, DECK_ORDER } from '/decide/swipe-v2/swipe-lean.js';

const FACE = s => `/decide/mio/${s}.png`;
const stage = document.getElementById('stage');
const prog  = document.getElementById('prog');
const backBtn = document.getElementById('back');
const passEl = document.getElementById('pass');
const mqm = window.matchMedia('(prefers-reduced-motion: reduce)');
const reduce = () => mqm.matches;
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const params = new URLSearchParams(location.search);

const THEME_META = {
  card:  { em:'💳', h:'そのクレカ、\n申し込む？見送る？' },
  sim:   { em:'📱', h:'格安SIMに\n乗り換える？今のまま？' },
  sub:   { em:'📺', h:'このサブスク、\n解約する？続ける？' },
  hikari:{ em:'🌐', h:'光回線を\n乗り換える？今のまま？' },
};
const CTA = { card:'https://coconala.com/services/4398298', _default:'https://coconala.com/services/4395009' };

// --- 計測（端末内 + CFビーコンはpushStateで拾う。個人情報は送らない）---
function track(p){ try{ history.replaceState(null,'','/decide/swipe-v2/'+p); }catch(e){} }
function logEv(name,data){ try{ const k='mio_swipe_ev'; const a=JSON.parse(localStorage.getItem(k)||'[]'); a.push({t:Date.now(),name,...data}); localStorage.setItem(k,JSON.stringify(a.slice(-200))); }catch(e){} }

// --- Pass（有料）状態：本番はマジックリンク/サーバ発行。ここではデモ用のクライアントスタブ ---
function readPass(){
  try{
    if(params.get('pass')){ // ?pass=1 で3回のデモPassを付与
      const cur = JSON.parse(localStorage.getItem('mio_pass')||'null');
      if(!cur || cur.credits==null){ const p={credits:3, issued:Date.now()}; localStorage.setItem('mio_pass',JSON.stringify(p)); return p; }
      return cur;
    }
    return JSON.parse(localStorage.getItem('mio_pass')||'null');
  }catch(e){ return null; }
}
let pass = readPass();
function renderPass(){
  if(pass && pass.credits>0){ passEl.textContent='Mio Pass 残り'+pass.credits+'回'; passEl.classList.remove('hide'); }
  else passEl.classList.add('hide');
}

// ============================================================ ルーティング
let state = { screen:'theme', theme:null, cards:[], idx:0, answers:{}, order:[], mode:'free' };

function goTheme(){
  state = { screen:'theme', theme:null, cards:[], idx:0, answers:{}, order:[], mode:'free' };
  renderPass(); prog.classList.add('hide'); backBtn.classList.remove('on');
  renderThemeSelect(); track('start');
}
function startTheme(theme, mode){
  const paid = mode==='pass' && pass && pass.credits>0;
  state = {
    screen:'deck', theme, idx:0, answers:{}, mode: paid?'pass':'free',
    cards: paid ? buildPassCards(theme) : buildDeck(theme).cards.map(c=>({...c,type:'swipe'})),
    order: [],
  };
  prog.classList.remove('hide'); renderPass();
  buildProg(state.cards.length);
  renderDeck(); track((paid?'pass-':'')+theme);
  logEv('deck_start',{theme,mode:state.mode});
}

// pass（有料）は全設問（二択=swipe / 3-4択=choice）
function buildPassCards(theme){
  const tpl = TEMPLATES[theme];
  return tpl.questions.map(q=>{
    const main = q.options.filter(o=>o.value!=='unknown');
    const unsure = q.options.find(o=>o.value==='unknown');
    if(main.length===2){
      const l = q.options.find(o=>o.swipe==='left')  || main[0];
      const r = q.options.find(o=>o.swipe==='right') || main[1];
      return { type:'swipe', id:q.id, prompt:q.prompt, hint:q.hint||'', face:q.face,
        left:{value:l.value,label:l.label}, right:{value:r.value,label:r.label},
        unsure: unsure?{value:'unknown',label:unsure.label}:{value:'unknown',label:'わからない'} };
    }
    return { type:'choice', id:q.id, prompt:q.prompt, hint:q.hint||'', face:q.face,
      options:q.options.map(o=>({value:o.value,label:o.label})) };
  });
}

function buildProg(n){
  prog.innerHTML=''; for(let i=0;i<n;i++) prog.appendChild(el('i'));
}
function paintProg(){
  [...prog.children].forEach((it,i)=>{ it.className = i<state.idx?'fill':(i===state.idx?'now':''); });
}

// ============================================================ テーマ選択（横カード）
function renderThemeSelect(){
  stage.className=''; stage.innerHTML='';
  const lead = el('div','lead');
  lead.appendChild(el('h1','','迷いを、3スワイプで整理。'));
  lead.appendChild(el('p','','今日いちばん決めたいテーマを選んで、カードを左右にスワイプ。<br>説明はいりません。3枚で「今の傾き」が出ます。'));
  stage.appendChild(lead);
  const track_ = el('div','track');
  DECK_ORDER.forEach(theme=>{
    const tpl=TEMPLATES[theme], m=THEME_META[theme];
    const c=el('div','tcard');
    c.appendChild(el('div','em',m.em));
    c.appendChild(el('h3','', (m.h||tpl.title).replace(/\n/g,'<br>')));
    c.appendChild(el('div','ab','選ぶのは <b>'+tpl.choiceA+'</b> か <b>'+tpl.choiceB+'</b>'));
    c.appendChild(el('div','go','スワイプで始める →'));
    c.onclick=()=>startTheme(theme, pass&&pass.credits>0?'pass':'free');
    track_.appendChild(c);
  });
  stage.appendChild(track_);
  stage.appendChild(el('div','swipehint','← 横にスクロールしてテーマを選ぶ →'));
}

// ============================================================ デッキ（スワイプ）
let drag = null;
function renderDeck(){
  stage.className=''; stage.innerHTML=''; paintProg();
  backBtn.classList.toggle('on', state.idx>0);
  const wrap = el('div','deckwrap');
  wrap.id='deckwrap';
  const mio = el('img'); mio.id='mio'; mio.src=FACE('normal'); mio.alt='Mio'; wrap.appendChild(mio);
  const react = el('div','react'); react.id='react'; wrap.appendChild(react);
  const zone = el('div'); zone.id='cardzone'; wrap.appendChild(zone);

  // 背面カード（次の設問）
  const nextCard = state.cards[state.idx+1];
  if(nextCard){ const b=buildCardEl(nextCard,true); b.classList.add('back'); zone.appendChild(b); }
  // 前面カード（現在）
  const cur = state.cards[state.idx];
  const front = buildCardEl(cur,false);
  zone.appendChild(front);

  // 下部コントロール
  const ctrls = el('div'); ctrls.id='ctrls';
  if(cur.type==='swipe'){
    const lr = el('div','lr');
    const bl = el('button','lrbtn l','<small>← 左スワイプ</small>'+cur.left.label);
    const br = el('button','lrbtn r','<small>右スワイプ →</small>'+cur.right.label);
    bl.onclick=()=>commit('left'); br.onclick=()=>commit('right');
    lr.appendChild(bl); lr.appendChild(br); ctrls.appendChild(lr);
    const uns=el('button',null,cur.unsure.label); uns.id='unsure'; uns.onclick=()=>commit('unsure'); ctrls.appendChild(uns);
    attachDrag(front, cur);
  }
  wrap.appendChild(ctrls);
  stage.appendChild(wrap);
  document.onkeydown = onKey;
}

function buildCardEl(card, isBack){
  const c = el('div','card');
  c.appendChild(el('div','qn','質問 '+ (state.cards.indexOf(card)+1) +' / '+state.cards.length));
  c.appendChild(el('div','qp',card.prompt));
  if(card.hint) c.appendChild(el('div','qh',card.hint));
  if(card.type==='swipe'){
    const eL=el('div','edge l',card.left.label); const eR=el('div','edge r',card.right.label);
    eL.dataset.edge='l'; eR.dataset.edge='r'; c.appendChild(eL); c.appendChild(eR);
    c.appendChild(el('div','grip','カードをつかんで左右へ、またはタップ'));
  } else {
    const g=el('div','choices'+(card.options.length>4?'':'')); if(card.options.length%2!==0 && card.options.length>2){}
    card.options.forEach(o=>{ const b=el('button','choice',o.label); b.onclick=()=>commitChoice(card,o.value); g.appendChild(b); });
    c.appendChild(g);
  }
  return c;
}

// --- ドラッグ（指/マウス追従・回転・閾値・飛ばし/戻し）---
function attachDrag(cardEl, card){
  const eL = cardEl.querySelector('.edge.l'), eR = cardEl.querySelector('.edge.r');
  const mio = document.getElementById('mio');
  const TH = 88;
  const onDown = (e)=>{
    if(state.animating) return;
    cardEl.setPointerCapture && cardEl.setPointerCapture(e.pointerId);
    drag = { x0:e.clientX, y0:e.clientY, dx:0, dy:0 };
    cardEl.style.transition='none';
    setFace('thinking');
  };
  const onMove = (e)=>{
    if(!drag) return;
    drag.dx = e.clientX-drag.x0; drag.dy = e.clientY-drag.y0;
    const rot = Math.max(-6,Math.min(6, drag.dx/18));
    cardEl.style.transform = `translate(${drag.dx}px, ${drag.dy*0.28}px) rotate(${reduce()?0:rot}deg)`;
    const t = Math.min(1, Math.abs(drag.dx)/TH);
    if(drag.dx>0){ eR.style.opacity=0.28+t*0.72; eL.style.opacity=0.12; }
    else if(drag.dx<0){ eL.style.opacity=0.28+t*0.72; eR.style.opacity=0.12; }
  };
  const onUp = ()=>{
    if(!drag) return;
    const dx=drag.dx; drag=null;
    if(Math.abs(dx)>TH){ commit(dx>0?'right':'left'); }
    else { cardEl.style.transition='transform .28s cubic-bezier(.2,.8,.3,1)'; cardEl.style.transform=''; eL.style.opacity=0.28; eR.style.opacity=0.28; setFace('normal'); }
  };
  cardEl.addEventListener('pointerdown',onDown);
  cardEl.addEventListener('pointermove',onMove);
  cardEl.addEventListener('pointerup',onUp);
  cardEl.addEventListener('pointercancel',onUp);
}

function setFace(s){ const m=document.getElementById('mio'); if(m) m.src=FACE(s); }
function reactMsg(txt,face){
  const r=document.getElementById('react'); if(!r) return;
  if(face) setFace(face);
  r.textContent=txt; r.classList.add('on');
  setTimeout(()=>{ r.classList.remove('on'); }, 900);
}

function commit(dir){
  if(state.animating) return;
  const card = state.cards[state.idx];
  let value, side;
  if(dir==='unsure'){ value=card.unsure.value; side='unsure'; }
  else { value = dir==='right'?card.right.value:card.left.value; side=dir; }
  state.answers[card.id]=value; state.order.push(card.id);
  // Mio反応
  const last = state.idx===state.cards.length-1;
  const before = state.cards.length-1-state.idx; // 残り
  if(side==='unsure') reactMsg('そこは、あとで詰めよう','troubled');
  else if(before===1) reactMsg('あと1枚…！','smirk');
  else if(last) reactMsg('よし、整理できた','convinced');
  else reactMsg(['なるほど','ここ、大事','了解！'][state.idx % 3],'convinced');
  logEv('answer',{theme:state.theme,q:card.id,value,side});
  flyOut(side);
}

function commitChoice(card,value){
  if(state.animating) return;
  state.answers[card.id]=value; state.order.push(card.id);
  reactMsg('了解','convinced');
  logEv('answer',{theme:state.theme,q:card.id,value,side:'choice'});
  flyOut('right');
}

function flyOut(side){
  state.animating=true;
  const front = stage.querySelector('#cardzone .card:last-child');
  const dur = reduce()?0:300;
  if(front && !reduce()){
    front.style.transition='transform .3s ease, opacity .3s ease';
    const x = side==='left'?-620 : side==='right'?620 : 0;
    const y = side==='unsure'?-680:0;
    front.style.transform=`translate(${x}px,${y}px) rotate(${side==='left'?-16:side==='right'?16:0}deg)`;
    front.style.opacity='0';
  }
  setTimeout(()=>{
    state.animating=false;
    state.idx++;
    if(state.idx>=state.cards.length){ runAnalyze(); }
    else { renderDeck(); }
  }, dur);
}

function onKey(e){
  if(state.screen!=='deck') return;
  const card=state.cards[state.idx]; if(!card||card.type!=='swipe') return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); commit('left'); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); commit('right'); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); commit('unsure'); }
}

backBtn.onclick=()=>{
  if(state.screen==='deck'){
    if(state.idx>0){ const last=state.order.pop(); delete state.answers[last]; state.idx--; renderDeck(); }
    else goTheme();
  } else if(state.screen==='result'){ state.screen='deck'; state.idx=state.cards.length-1; state.order.pop(); delete state.answers[state.cards[state.idx].id]; prog.classList.remove('hide'); renderDeck(); }
  else goTheme();
};

// ============================================================ 分析演出（レンズ）
async function runAnalyze(){
  state.screen='analyze'; stage.className='center'; stage.innerHTML=''; prog.classList.add('hide'); backBtn.classList.remove('on');
  track('analyze');
  const lens=el('div'); lens.id='lens';
  lens.appendChild(el('div','ring r1')); lens.appendChild(el('div','ring r2')); lens.appendChild(el('div','ring r3'));
  const img=el('img'); img.src=FACE('thinking'); img.alt='Mio'; lens.appendChild(img);
  stage.appendChild(lens);
  const txt=el('div',null,'回答を読み込み中…'); txt.id='anatext'; stage.appendChild(txt);

  if(reduce()){ await sleep(300); return showResult(); }

  // 3枚の回答チップが Mio のレンズへ吸い込まれる
  const zone=lens.getBoundingClientRect();
  state.cards.forEach((c,i)=>{
    const chip=el('div','chip-fly', c.type==='swipe'? (state.answers[c.id]==='unknown'?'？':(state.answers[c.id]===c.left.value?c.left.label:c.right.label)) : '回答'+(i+1));
    chip.style.left = (18 + i*96) + 'px';
    chip.style.top = (zone.bottom + 40) + 'px';
    stage.appendChild(chip);
    requestAnimationFrame(()=>{
      setTimeout(()=>{ chip.style.transform=`translate(${zone.left+zone.width/2 - (18+i*96) - 30}px, ${zone.top+zone.height/2 - (zone.bottom+40)}px) scale(.3)`; chip.style.opacity='0'; }, 60+i*140);
    });
  });
  const rings=[...lens.querySelectorAll('.ring')];
  const steps=['迷いの正体を整理中…','判断軸を照らしています…','傾きを計算中…'];
  for(let i=0;i<3;i++){ await sleep(360); rings[i].classList.add('lit'); txt.textContent=steps[i]; }
  await sleep(420);
  showResult();
}

// ============================================================ 結果
function showResult(){
  if(state.mode==='pass'){ return showPaidResult(); }
  state.screen='result'; stage.className='scroll'; stage.innerHTML=''; track('result');
  backBtn.classList.remove('on');
  const lean = leanFree(state.theme, state.answers);
  logEv('result',{theme:state.theme,dir:lean.dir,code:lean.code});
  const tpl=TEMPLATES[state.theme];
  const res=el('div','res');
  const m=el('img','rmio'); m.src=FACE(lean.face); m.alt='Mio'; res.appendChild(m);
  res.appendChild(el('div','lean','あなたはいま'));
  res.appendChild(el('div','leanbig', lean.dir==='neutral'?'<b>まだ五分</b>':('<b>'+ (lean.dir==='A'?tpl.choiceA:tpl.choiceB) +'</b> 寄り')));
  // 気付き1つ
  const ins=el('div','insight'); ins.appendChild(el('div','lb','いちばんの気付き')); ins.appendChild(el('div','tx',lean.insight)); res.appendChild(ins);
  // 回答3件の要約
  const sum=el('div','sumrow');
  state.cards.forEach(c=>{
    const v=state.answers[c.id];
    const aLabel = v==='unknown' ? 'わからない' : (v===c.left.value?c.left.label:c.right.label);
    const s=el('div','s'); s.appendChild(el('b','',shortQ(c.prompt))); s.appendChild(el('span','',aLabel)); sum.appendChild(s);
  });
  res.appendChild(sum);
  res.appendChild(el('div','code','判定コード <b>'+lean.code+'</b>（有料版に貼ると、この回答から続けられます）'));
  // 有料で分かることの予告（ぼかしロック）
  const lk=el('div','locked');
  lk.appendChild(el('div','lb','🔒 有料版で、ここまで出ます'));
  const ul=el('ul');
  [['最終判定','GO ／ 見送り ／ 今は決めない を1つに言い切り'],
   ['決め手','あなたの数字にもとづく理由'],
   ['見落としやすい盲点','ここを外すと損する一点'],
   ['今日やる一手','迷いを終わらせる具体アクション']].forEach(([k,v])=>{
    const li=el('li'); li.appendChild(el('span','', '▸ '+k+'：')); li.appendChild(el('span','blur',v)); ul.appendChild(li);
  });
  lk.appendChild(ul); res.appendChild(lk);
  // CTA
  const cta=el('a','cta','この迷いを、結論まで進める<small>最終判定・決め手・盲点・今日の一手まで（¥1,000）</small>');
  cta.href=(CTA[state.theme]||CTA._default); cta.target='_blank'; cta.rel='noopener';
  cta.onclick=()=>{ logEv('cta_click',{theme:state.theme,code:lean.code}); track('cta'); };
  res.appendChild(cta);
  const redo=el('button','redo','もう一度スワイプする'); redo.onclick=()=>goTheme(); res.appendChild(redo);
  res.appendChild(el('div','disc','無料版は「今の傾き」を整理するものです。最終判定・金額計算・個別助言は含みません。<br>最新の年会費・料金・特典は各社公式でご確認ください。'));
  stage.appendChild(res);
}
function shortQ(p){ return p.replace(/[（(].*$/,'').replace(/[?？].*$/,'').slice(0,16); }

// 有料（Pass）：全設問回答→ decide() で最終判定を同画面に即時表示（有料エンジンはpass時のみ動的import）
async function showPaidResult(){
  state.screen='result'; stage.className='scroll'; stage.innerHTML=''; track('pass-result');
  const res=el('div','res');
  res.appendChild(el('div','lean','読み込み中…')); stage.appendChild(res);
  let decide;
  try{ ({ decide } = await import('/decide/paid/decide-engine.js')); }catch(e){ decide=null; }
  let out=null; try{ out = decide? decide(state.theme, state.answers): null; }catch(e){ out=null; }
  const r = (out && out.done && out.result) ? out.result : null; // decide()は {done, result} 形。必ず result を取り出す
  stage.innerHTML=''; const box=el('div','res');
  const face = r? (r.verdict==='GO'?'thumbs_up':r.verdict==='NO'?'troubled':'thinking') : 'troubled';
  const m=el('img','rmio'); m.src=FACE(face); box.appendChild(m);
  if(!r){ box.appendChild(el('div','leanbig','<b>もう少し情報が要ります</b>')); box.appendChild(el('div','insight','<div class="tx">推測では判定しません（HOLD）。不足している項目を確認してからお届けします。</div>')); stage.appendChild(box); return; }
  const lab = r.verdict==='GO'?'✅ GO':(r.verdict==='NO'?'⛔ 見送り':'🟡 今は決めない');
  const center=el('div'); center.style.textAlign='center';
  center.appendChild(el('span','badge '+r.verdict,lab)); box.appendChild(center);
  if(r.chosen) box.appendChild(el('div','leanbig','<b>'+r.chosen+'</b>'));
  if(r.headline){ const h=el('div','insight'); h.style.borderColor='#2e7d4355'; h.appendChild(el('div','tx',r.headline)); box.appendChild(h); }
  const mk=(lb,tx)=>{ const s=el('div','insight'); s.appendChild(el('div','lb',lb)); s.appendChild(el('div','tx',tx)); box.appendChild(s); };
  if(r.reasons&&r.reasons.length) mk('決め手', r.reasons.map(x=>'・'+x).join('<br>'));
  if(r.drop_reason) mk('選ばなかった方を捨てる理由', r.drop_reason);
  if(r.blindspot) mk('見落としやすい盲点', r.blindspot);
  if(r.today) mk('今日やる一手', r.today);
  // Pass消費
  if(pass && pass.credits>0){ pass.credits--; localStorage.setItem('mio_pass',JSON.stringify(pass)); renderPass(); }
  box.appendChild(el('div','disc','最新の年会費・料金・特典は各社公式でご確認ください。個別の与信・投資・借入の助言ではありません。'));
  const redo=el('button','redo','別のテーマも判定する'); redo.onclick=()=>goTheme(); box.appendChild(redo);
  stage.appendChild(box);
}

// ============================================================ 起動
window.__mio = () => ({ screen:state.screen, idx:state.idx, n:state.cards.length, animating:!!state.animating, answers:{...state.answers}, theme:state.theme, mode:state.mode });
renderPass();
const t0 = params.get('t');
if(t0 && TEMPLATES[t0]) startTheme(t0, pass&&pass.credits>0?'pass':'free');
else goTheme();
</script>
